# Configuração do LiveKit para ambiente.
port: 7880
prometheus_port: 6789

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50019
  # Na nuvem com NAT 1:1, use_external_ip faz o LiveKit descobrir o IP público
  # da VM via STUN para os candidatos ICE de WebRTC.
  use_external_ip: true

keys:
  remotekey: dev-only-remote-secret-change-in-production-12345

room:
  empty_timeout: 900
  departure_timeout: 900

# Comunicação interna entre containers na mesma rede Docker.
# O container 'server' escuta na porta interna 8080.
webhook:
  api_key: remotekey
  urls:
    - http://server:8080/api/v1/internal/livekit/webhook

logging:
  level: info
  json: false

