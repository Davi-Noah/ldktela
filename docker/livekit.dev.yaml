# Configuracao de DESENVOLVIMENTO do LiveKit. Chaves triviais, nunca reais.
port: 7880
# Contadores reais de bytes, medidos pelo SFU. O RNF-05 exige egress *medido* e
# nao extrapolado do painel do cliente, que so sabe o que ele acha que enviou.
prometheus_port: 6789
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50019
  # PRECISA ficar `false`. Com `true` o LiveKit descobre o IP PUBLICO por STUN e
  # sobrescreve o `node_ip` abaixo: os candidatos ICE saem com o IP do provedor,
  # que nem a propria maquina alcanca (roteador domestico nao faz hairpin NAT).
  # O sintoma e `could not establish pc connection` com a sinalizacao funcionando.
  use_external_ip: false
  # Sem isto o LiveKit anuncia o IP do CONTAINER (172.x) como candidato ICE, e a
  # maquina do host nao roteia para la: a sinalizacao conecta, a midia nao, e o
  # sintoma e alguns segundos de espera seguidos de falha — nao um erro claro.
  # Para o teste entre duas maquinas (DESTRAVAR.md, Fase 2), troque pelo IP da
  # maquina na LAN.
  node_ip: 192.168.0.9

keys:
  devkey: dev-only-not-a-real-key-0123456789abcdef

# RNF-10: o ciclo de vida da sala e do proprio LiveKit, nao de um varredor no
# backend. `empty_timeout` fecha a sala criada e nunca ocupada; `departure_timeout`
# fecha a sala depois que o ultimo participante sai. Ambos em 900 s (15 min).
room:
  empty_timeout: 900
  departure_timeout: 900

# O backend e a unica fonte de VOICE_STATE_UPDATE (rest-api.md §6.9), e so
# recebe estado por aqui. `api_key` seleciona a chave que assina o corpo; a
# assinatura e verificada antes de qualquer leitura.
# host.docker.internal e o host do Docker Desktop; em Linux vem do extra_hosts
# declarado no compose.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8080/api/v1/internal/livekit/webhook

logging:
  level: info
  json: false
