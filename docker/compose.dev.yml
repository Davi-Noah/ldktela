# Infraestrutura de DESENVOLVIMENTO local. Nao descreve producao.
# Credenciais aqui sao deliberadamente triviais e nao existem fora da maquina.
name: ldkcord-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ldkcord-postgres
    environment:
      POSTGRES_USER: comms
      POSTGRES_PASSWORD: comms
      POSTGRES_DB: comms
      # Locale exigido pela busca full-text em portugues (RF-17).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comms -d comms"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: ldkcord-livekit
    command: --config /etc/livekit.yaml --dev
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    # O webhook sai do container para o backend na maquina. No Docker Desktop
    # host.docker.internal ja existe; em Linux precisa desta linha.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"
      - "7881:7881"
      # Faixa UDP de midia. Sem ela, so o fallback TCP/7881 funciona, e um teste
      # entre duas maquinas mediria o caminho errado. E a faixa reduzida de dev
      # (DECISIONS [E0]); a de producao, 50000-60000, nao cabe no Docker Desktop.
      - "50000-50019:50000-50019/udp"
      # Faixa UDP reduzida em dev: mapear 10k portas no Docker Desktop e inviavel.
      # Em producao a faixa e 50000-60000, conforme SRS 7.1.
      - "50000-50019:50000-50019/udp"
    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  pgdata:
