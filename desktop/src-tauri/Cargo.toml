[package]
name = "ldktela-desktop"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
rust-version = "1.98"

[lib]
name = "ldktela_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Publicacao de midia no core (ADR-0026). Versao exata: e a terceira ponta do par
# do ADR-0019, junto do livekit-client e da imagem do servidor.
livekit = { version = "=0.9.1", default-features = false, features = ["native", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tauri-plugin-notification = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-updater = "2.11.0"
# So para reiniciar o processo depois de instalar uma atualizacao (RF-28): sem
# isto o binario novo so entra em uso na proxima vez que o usuario abrir o app.
tauri-plugin-process = "2"
# Atalho global de parada (Ctrl+Shift+E). O aplicativo vive na bandeja com a
# janela escondida: sem atalho, parar uma transmissao errada exige achar a
# janela primeiro. Registrado no Rust, entao nao entra em capabilities nem no
# package.json.
tauri-plugin-global-shortcut = "2"
# Miniatura do seletor e preview da propria tela (ADR-0030). Codificador puro,
# sem dependencia transitiva; a alternativa era mandar RGBA cru pelo IPC, 25x
# maior por quadro.
jpeg-encoder = "0.6"

# O backend do cofre e por plataforma: com `windows-native` sozinho, em Linux o
# keyring cai no store mock, em memoria, e o token some a cada execucao.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# WASAPI process loopback (ADR-0025) e o HWND das nossas janelas, para tira-las
# do seletor. A versao acompanha a que o Tauri ja resolve: divergir daria dois
# tipos `HWND` incompativeis.
# A macro `#[implement]` gera caminhos `windows_core::...` na raiz do crate, entao
# ele precisa ser dependencia direta e nao so reexport de `windows::core`.
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
# Usado so para religar WebRTC no WebKitGTK. A versao acompanha a que o Tauri ja
# resolve (2.0.2); divergir daria dois tipos `WebView` incompativeis.
webkit2gtk = { version = "2.0", features = ["v2_38"] }

# So para cunhar um token no teste ponta a ponta contra o LiveKit de
# desenvolvimento. `access-token` sozinho nao traz cliente HTTP nenhum.
[dev-dependencies]
livekit-api = { version = "0.6", default-features = false, features = ["access-token"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
